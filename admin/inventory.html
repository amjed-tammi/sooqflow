<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | SooqFlow</title>
</head>

<body>

    <main>
        <h1>Inventory Snapshot</h1>
        <p> Demo inventory data. This page is not access-controlled</p>
        <table border="1">
            <caption>
                Demo stock levels by product
            </caption>
            <!-- title Row -->
            <thead>
                <tr>
                    <th scope="col">Product</th>
                    <th scope="col">SKU</th>
                    <th scope="col">Unit Price</th>
                    <th scope="col">Stock</th>

                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Mechanical Keyboard</th>
                    <td>KB-001</td>
                    <td>45.000</td>
                    <td>8</td>
                </tr>
                <tr>
                    <th scope="row">Wireless Mouse</th>
                    <td>MS-001</td>
                    <td>18.500</td>
                    <td>15</td>
                </tr>
                <tr>
                    <th scope="row">LED Monitor</th>
                    <td>MN-001</td>
                    <td>149.000</td>
                    <td>6</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row" colspan="3">Total Units in stock</th>
                    <td>29</td>
                </tr>

            </tfoot>
        </table>
    </main>

</body>

</html>
